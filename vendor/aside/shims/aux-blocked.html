<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Page blocked by Aux</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { width: min(520px, calc(100vw - 48px)); }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  p { margin: 0 0 12px; color: color-mix(in srgb, CanvasText 70%, transparent); }
  code { display: block; margin: 16px 0; padding: 10px 12px; border-radius: 10px; word-break: break-all; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: color-mix(in srgb, CanvasText 8%, transparent); }
  .row { display: flex; gap: 8px; margin-top: 20px; }
  button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: #6b63f0; border-color: #6b63f0; color: #fff; }
  details { margin-top: 20px; color: color-mix(in srgb, CanvasText 70%, transparent); }
</style>
</head>
<body>
<main>
  <h1>Aux blocked this page</h1>
  <p>A content filter matched this address before it was loaded.</p>
  <code id="url"></code>
  <p>Continuing allows only this navigation in the current tab.</p>
  <div class="row">
    <button class="primary" id="back">Go back</button>
    <button id="continue">Continue once</button>
  </div>
  <details><summary>Details</summary><p>Rule source: Aux content filters. Reload the page after you turn filters off in Settings to load it normally.</p></details>
</main>
<script src="/aux-blocked.js"></script>
</body>
</html>
