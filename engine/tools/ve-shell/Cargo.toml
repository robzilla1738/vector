[package]
name = "ve-shell"
description = "Native-only Vector Engine shell (VEC-014). No Chromium."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## OS window through winit + softbuffer.
window = ["dep:winit", "dep:softbuffer", "dep:accesskit", "dep:accesskit_winit"]
## Page scripts through V8.
v8 = ["ve-api/v8"]
## Fetch `http:` / `https:` documents.
http = ["ve-api/http"]
## GPU present path (optional).
gpu = ["ve-api/gpu", "dep:ve-gfx", "dep:wgpu", "dep:pollster"]
## Packaged native product: window + V8 + HTTP + GPU present.
product = ["window", "v8", "http", "gpu"]

[dependencies]
ve-api.workspace = true
ve-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
ve-gfx = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }

[dev-dependencies]
ve-api.workspace = true
serde_json.workspace = true
