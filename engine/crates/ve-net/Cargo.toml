[package]
name = "ve-net"
description = "Networking for the Vector Engine: per-context fetch with cookie jar and HTTP cache; optional hyper + rustls transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## Enable the real HTTP(S) transport built on hyper, rustls and tokio.
http = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:tokio"]

[dependencies]
ve-core.workspace = true
bytes.workspace = true
http.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
