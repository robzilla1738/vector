[package]
name = "ve-napi"
description = "Node.js bindings for the Vector Engine via napi-rs (optional feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
## Build the real N-API module. Without it the crate is an inert placeholder.
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
ve-api.workspace = true
serde_json.workspace = true
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true, optional = true }
