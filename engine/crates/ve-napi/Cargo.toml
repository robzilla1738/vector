[package]
name = "ve-napi"
description = "Node.js bindings for the Vector Engine via napi-rs (optional feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
## Build the real N-API module. Without it the crate is an inert placeholder
## (the engine host, step translation and observation shaping still compile
## and are unit-tested without Node headers). A Node module without
## networking is useless, so the feature also turns on `http`.
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build", "http"]
## Forward: real HTTP(S) transport so `http(s):` URLs can be opened.
http = ["ve-api/http"]

[dependencies]
ve-api.workspace = true
ve-agent.workspace = true
ve-a11y.workspace = true
ve-core.workspace = true
ve-dom.workspace = true
ve-net.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }

[dev-dependencies]
ve-html.workspace = true

[build-dependencies]
napi-build = { workspace = true, optional = true }
