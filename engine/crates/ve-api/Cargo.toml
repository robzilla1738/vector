[package]
name = "ve-api"
description = "Public facade for the Vector Engine: the VectorEngine handle and a C ABI returning JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
## Forward: QuickJS-NG JavaScript backend.
quickjs = ["ve-script/quickjs"]
## Forward: V8 JavaScript backend (decision D1).
v8 = ["ve-script/v8", "ve-agent/v8"]
## Forward: vello + wgpu GPU rendering.
gpu = ["ve-gfx/gpu"]
## Forward: hyper + rustls HTTP transport.
http = ["ve-net/http"]

[dependencies]
ve-core.workspace = true
ve-net.workspace = true
ve-html.workspace = true
ve-dom.workspace = true
ve-style.workspace = true
ve-layout.workspace = true
ve-a11y.workspace = true
ve-script.workspace = true
ve-gfx.workspace = true
ve-agent.workspace = true
ve-chrome.workspace = true
ve-profile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ed25519-dalek.workspace = true
accesskit.workspace = true
url.workspace = true

[dev-dependencies]
url.workspace = true
http.workspace = true
