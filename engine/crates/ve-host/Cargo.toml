[package]
name = "ve-host"
description = "Per-context Vector Engine process (plan A21): no sockets, JSON control pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ve-host"
path = "src/main.rs"

[features]
default = []
## Scripting inside the isolated host (same V8 as the N-API addon).
v8 = ["ve-napi/v8"]

[dependencies]
ve-napi = { path = "../ve-napi" }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Rpc",
] }

[dev-dependencies]
ve-napi = { path = "../ve-napi" }
serde_json.workspace = true
