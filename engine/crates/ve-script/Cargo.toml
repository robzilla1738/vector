[package]
name = "ve-script"
description = "Scripting for the Vector Engine: VM-agnostic JavaScript interface, event loop and WebIDL binding scaffolding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
## Enable the QuickJS-NG backend (requires a C compiler).
quickjs = ["dep:rquickjs"]
## Enable the V8 backend (downloads a prebuilt static library; ~50 MB).
v8 = ["dep:v8"]

[dependencies]
ve-core.workspace = true
ve-dom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rquickjs = { workspace = true, optional = true }
v8 = { workspace = true, optional = true }
