<!DOCTYPE html>
<meta charset="utf-8">
<title>pixel clip</title>
<style>
  body { margin: 0; background: white; }
  .clip { width: 50px; height: 50px; overflow: hidden; }
  .inner { width: 200px; height: 200px; background: red; }
</style>
<div class="clip" data-pixel data-sample-x="10" data-sample-y="10" data-sample-rgb="255,0,0" data-sample2-x="80" data-sample2-y="80" data-sample2-rgb="255,255,255" data-sample-tol="30">
  <div class="inner"></div>
</div>
