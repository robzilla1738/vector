<!DOCTYPE html>
<title>Text.splitText</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script>
test(function() {
  var t = document.createTextNode("abcd")
  document.body.appendChild(t)
  var rest = t.splitText(2)
  assert_equals(t.data, "ab")
  assert_equals(rest.data, "cd")
  assert_equals(t.nextSibling, rest)
}, "splitText splits data and inserts the remainder")
</script>
