<!DOCTYPE html>
<title>Node.isSameNode</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script>
test(function() {
  var el = document.createElement("div")
  assert_true(el.isSameNode(el))
  assert_false(el.isSameNode(document.createElement("div")))
  assert_false(el.isSameNode(null))
  var clone = el.cloneNode(true)
  assert_false(el.isSameNode(clone))
}, "isSameNode is identity, not structural equality")
</script>
