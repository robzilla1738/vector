<!DOCTYPE html>
<meta charset="utf-8">
<title>ParentNode.prepend</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="host"><span id="keep">keep</span></div>
<script>
test(function () {
  var host = document.getElementById("host");
  host.prepend("A", document.createElement("em"));
  assert_equals(host.childNodes[0].textContent, "A");
  assert_equals(host.childNodes[1].localName, "em");
  assert_equals(host.childNodes[2].id, "keep");
}, "prepend inserts nodes before the first child in order");
</script>
