<!DOCTYPE html>
<title>Element.classList</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script>
test(function() {
  var el = document.createElement("div")
  document.body.appendChild(el)
  el.classList.add("a")
  assert_true(el.classList.contains("a"))
  assert_equals(el.className, "a")
  el.classList.add("b")
  assert_true(el.classList.contains("b"))
  assert_false(el.classList.toggle("a"))
  assert_false(el.classList.contains("a"))
  assert_true(el.classList.toggle("c"))
  assert_true(el.matches(".b.c"))
}, "classList add/remove/toggle/contains")
</script>
