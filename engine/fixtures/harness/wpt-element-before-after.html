<!DOCTYPE html>
<title>ChildNode before, after, replaceWith</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script>
test(function() {
  var p = document.createElement("p")
  document.body.appendChild(p)
  p.before(document.createElement("a"))
  p.after(document.createElement("b"))
  assert_equals(p.previousSibling.nodeName, "A")
  assert_equals(p.nextSibling.nodeName, "B")
  p.replaceWith(document.createElement("i"))
  assert_equals(p.parentNode, null)
  assert_equals(document.body.getElementsByTagName("i").length, 1)
}, "before, after, and replaceWith move siblings")
</script>
