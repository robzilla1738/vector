<!DOCTYPE html>
<title>Node.hasChildNodes</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script>
test(function() {
  var el = document.createElement("div")
  assert_false(el.hasChildNodes())
  el.appendChild(document.createTextNode("x"))
  assert_true(el.hasChildNodes())
}, "hasChildNodes reflects light-tree children")
</script>
