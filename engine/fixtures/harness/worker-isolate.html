<!DOCTYPE html>
<meta charset="utf-8">
<title>Worker isolation</title>
<body>
<script>
window.__tests = [];
const w = new Worker("onmessage=function(e){postMessage({iso: typeof document, echo: e.data})}");
w.onmessage = (e) => {
  window.__tests.push(["worker.isolated-document", e.data && e.data.iso === "undefined"]);
  window.__tests.push(["worker.round-trip", e.data && e.data.echo === "ping"]);
};
w.postMessage("ping");
</script>
