<!DOCTYPE html>
<meta charset="utf-8">
<title>Upstream idlharness.js</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/WebIDLParser.js"></script>
<script src="/resources/idlharness.js"></script>
<body>
<script>
test(function () {
  assert_equals(typeof IdlArray, "function");
  assert_equals(typeof WebIDL2, "object");
  assert_equals(typeof WebIDL2.parse, "function");
  var ast = WebIDL2.parse("interface Element { readonly attribute DOMString tagName; };");
  assert_equals(ast[0].name, "Element");
  var idl_array = new IdlArray();
  idl_array.add_untested_idls("interface Element { readonly attribute DOMString tagName; };");
  assert_equals(typeof idl_array.test, "function");
}, "IdlArray and WebIDL2 from the pinned WPT IDL harness");
</script>
