name: runtime

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-unit:
    name: typecheck + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # tsc -b emits workspace dist; a separate `pnpm build` would repeat it
      - run: pnpm typecheck
      - run: pnpm bench:tasks --validate
      - run: pnpm --filter @aux/desktop build
      - run: pnpm budgets
      - run: pnpm test:unit

  integration:
    name: integration (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install headless Chromium (playwright-core download, no browsers bundled)
        run: pnpm --filter @aux/chromium-driver exec playwright-core install --with-deps chromium-headless-shell
      - name: Integration suite against the fixture sites
        run: pnpm test:integration
        env:
          AUX_CAPTURE_RESPONSES: "1"
      - name: Browser-layer benchmark against budgets
        run: pnpm bench --repeats 5 --check-budgets

  e2e:
    name: Electron e2e (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @aux/desktop build
      - run: pnpm test:e2e
      - run: node tests/smoke/shell-csp-desktop.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: release/test-artifacts
          if-no-files-found: ignore

  smoke:
    name: desktop smoke (release suite)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @aux/desktop build
      - run: pnpm package:local
      - run: pnpm smoke:release
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: release/test-artifacts
          if-no-files-found: ignore
