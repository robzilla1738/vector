name: runtime

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-unit:
    name: typecheck + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm bench:tasks --validate
      - run: pnpm build
      - run: pnpm --filter @aux/desktop typecheck
      - run: pnpm --filter @aux/desktop build
      - run: pnpm budgets
      - run: pnpm test:unit

  integration:
    name: integration (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install headless Chromium (playwright-core download, no browsers bundled)
        run: pnpm --filter @aux/chromium-driver exec playwright-core install --with-deps chromium-headless-shell
      - name: Integration suite against the fixture sites
        run: pnpm test:integration
        env:
          AUX_CAPTURE_RESPONSES: "1"
      - name: Browser-layer benchmark against budgets
        run: pnpm bench --repeats 5 --check-budgets

  e2e:
    name: Electron e2e (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @aux/desktop build
      - run: pnpm test:e2e

  smoke:
    name: desktop smoke (release suite)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @aux/desktop build
      - run: pnpm package:local
      - run: pnpm smoke:release
