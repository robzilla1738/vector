name: engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "packages/contracts/**"
      - "packages/browser-driver/**"
      - "apps/runtime/**"
      - "scripts/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "packages/contracts/**"
      - "packages/browser-driver/**"
      - "apps/runtime/**"
      - "scripts/**"
      - ".github/workflows/engine.yml"

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: engine

jobs:
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: test
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Golden snapshots are current
        run: cargo test -p ve-api --test golden
      - name: Negative containment (ve-host)
        run: cargo test -p ve-host --tests
      - name: Production profile fails closed without host
        env:
          VECTOR_ENGINE_PROFILE: production
        run: cargo test -p ve-napi -- production_without_host_fails_closed --nocapture
      - name: ve-net broker policy
        run: cargo test -p ve-net --lib broker

  features:
    name: optional features build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: features
      - name: http + quickjs + v8 + images
        run: cargo clippy -p ve-api --all-targets --features http,quickjs,v8 -- -D warnings
      - name: native product shell
        if: runner.os == 'macOS'
        run: cargo clippy -p ve-shell --all-targets --features product -- -D warnings
      - name: X11 deps for live window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 xvfb
      - name: Live OS window + MCP share one page (Gate B)
        if: runner.os == 'Linux'
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 1
          cargo test -p ve-shell --features window,v8,gpu --test window -- --nocapture
      - run: cargo test -p ve-net --features http
      - run: cargo test -p ve-script --features quickjs
      - name: V8 backend (prebuilt static lib download)
        run: cargo test -p ve-script --features v8
      - name: Page scripting on V8 (timers, console, evaluate gating)
        run: cargo test -p ve-agent --features v8
      - name: Production ve-host runs V8 under the sandbox
        run: cargo test -p ve-host --features v8 --tests
      - name: SPA fixtures settle on V8
        run: cargo test -p ve-api --features v8 --test spa
      - run: cargo test -p ve-gfx --features images

  perf-gate:
    name: perf --gate m1
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: perf
      - name: Enforce the M1 latency gates (p95 over the static corpus)
        run: cargo run --release -p perf -- --gate m1 --out perf-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: engine/perf-report.json

  wpt:
    name: WPT geometry reftests (manifest m1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: wpt
      - name: Pinned WPT checkout
        working-directory: ${{ runner.temp }}
        run: |
          REV=$(cat "${{ github.workspace }}/engine/conformance/wpt-revision.txt")
          git clone --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git wpt
          cd wpt
          git fetch --depth 1 origin "$REV"
          git checkout "$REV"
          git sparse-checkout set \
            css/CSS2/normal-flow css/CSS2/box-display css/CSS2/positioning css/CSS2/reference css/CSS2/support \
            css/css-flexbox css/css-flexbox/reference css/css-flexbox/support \
            css/css-grid/alignment css/css-grid/reference \
            css/selectors css/mediaqueries css/reference css/support \
            html/dom \
            accname html-aam common resources testharness.js testharnessreport.js \
            fonts interfaces
      - name: Vendored Ahem reftest font
        run: test -f conformance/fonts/Ahem.ttf
      - name: Reftest fonts via Parley (not the m1 scorer)
        run: cargo run --release -p wpt-runner -- --wpt-dir "${{ runner.temp }}/wpt" --use-reftest-fonts --limit 8 --manifest conformance/reftest-fonts.txt --out wpt-fonts-report.json
      - name: Every manifest test must still pass
        run: cargo run --release -p wpt-runner -- --wpt-dir "${{ runner.temp }}/wpt" --out wpt-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpt-report
          path: |
            engine/wpt-report.json
            engine/wpt-fonts-report.json

  wpt-harness:
    name: WPT testharness (supported subset + tree HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: wpt-harness
      - name: Pinned WPT checkout
        working-directory: ${{ runner.temp }}
        run: |
          REV=$(cat "${{ github.workspace }}/engine/conformance/wpt-revision.txt")
          git clone --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git wpt
          cd wpt
          git fetch --depth 1 origin "$REV"
          git checkout "$REV"
          git sparse-checkout set \
            html/dom resources testharness.js testharnessreport.js fonts interfaces
      - name: Vendored Ahem reftest font
        run: test -f conformance/fonts/Ahem.ttf
      - name: Supported testharness (blocking)
        run: cargo run --release -p wpt-harness --features v8 -- --http --wpt-dir "${{ runner.temp }}/wpt" --out wpt-supported-report.json
      - name: Supported testharness + html/dom tree (pass/fail/timeout/crash/skip)
        run: cargo run --release -p wpt-harness --features v8 -- --http --wpt-dir "${{ runner.temp }}/wpt" --tree --tree-family html/dom --timeout-secs 10 --out wpt-harness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpt-harness-report
          path: |
            engine/wpt-harness-report.json
            engine/wpt-supported-report.json

  browserbench:
    name: Speedometer/JetStream/MotionMark identity lab
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: browserbench
      - name: Official Speedometer 3.0 / JetStream / MotionMark GPU identity
        run: cargo run --release -p browserbench --features v8,gpu -- --gate --iterations 2 --out browserbench-report.json
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browserbench-report
          path: engine/browserbench-report.json

  addon:
    name: "@vector/engine-native (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: addon
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: cargo test -p ve-napi --features napi
      - name: Build the .node binary and ve-host next to index.js
        run: pnpm --filter @vector/engine-native build:cargo
        working-directory: .
      - name: Addon smoke test
        run: pnpm --filter @vector/engine-native test
        working-directory: .
      - name: Host binary is packaged
        run: test -x engine/crates/ve-napi/ve-host || test -x engine/crates/ve-napi/ve-host.exe
        working-directory: .
      - name: Packaged host runs the production fixture
        shell: bash
        working-directory: engine
        run: |
          if [ -x "$GITHUB_WORKSPACE/engine/crates/ve-napi/ve-host.exe" ]; then
            HOST="$GITHUB_WORKSPACE/engine/crates/ve-napi/ve-host.exe"
          else
            HOST="$GITHUB_WORKSPACE/engine/crates/ve-napi/ve-host"
          fi
          test -x "$HOST"
          VECTOR_PACKAGED_HOST="$HOST" cargo test -p ve-host --features v8 --test process production_sandbox -- --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: engine-native-${{ matrix.os }}
          path: |
            engine/crates/ve-napi/vector-engine.*.node
            engine/crates/ve-napi/ve-host
            engine/crates/ve-napi/ve-host.exe

  downloaded-artifact:
    name: downloaded release artifact (${{ matrix.os }})
    needs: addon
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: downloaded-artifact
      - uses: actions/download-artifact@v4
        with:
          name: engine-native-${{ matrix.os }}
          path: downloaded-artifact
      - name: Downloaded host runs the production fixture
        shell: bash
        working-directory: engine
        run: |
          HOST=$(find "$GITHUB_WORKSPACE/downloaded-artifact" \( -name ve-host -o -name ve-host.exe \) -type f | head -n 1)
          test -n "$HOST"
          chmod +x "$HOST"
          test -x "$HOST"
          echo "downloaded host=$HOST"
          VECTOR_PACKAGED_HOST="$HOST" cargo test -p ve-host --features v8 --test process production_sandbox -- --test-threads=1
