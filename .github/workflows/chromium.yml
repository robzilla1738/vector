name: Chromium fork

on:
  pull_request:
    paths:
      - 'chromium/**'
      - 'apps/desktop/renderer/**'
      - '.github/workflows/chromium.yml'
  push:
    branches: [main]
    paths:
      - 'chromium/**'
      - 'apps/desktop/renderer/**'
      - '.github/workflows/chromium.yml'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aux-chromium-build
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.repository.private &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, aux-mac]
    # A cold stable Chromium build on this Mac can exceed eight hours.
    timeout-minutes: 1080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source and patch series
        run: chromium/aux-chromium sanity
      - name: Check patch offsets and formatting
        run: chromium/aux-chromium validate
      - name: Nightly incremental build
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          chromium/aux-chromium configure --flavor dev
          chromium/aux-chromium build --flavor dev
