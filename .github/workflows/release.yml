# Founder builds only. External distribution requires a separate release decision.
name: private-engine-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: private build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vector/engine-native build:cargo
      - name: Stage release files
        shell: bash
        run: |
          mkdir -p dist/release
          cp -f engine/crates/ve-napi/ve-host dist/release/ve-host 2>/dev/null || true
          cp -f engine/crates/ve-napi/ve-host.exe dist/release/ve-host.exe 2>/dev/null || true
          cp -f engine/crates/ve-napi/vector-engine.*.node dist/release/ 2>/dev/null || true
          ls -la dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: aux-engine-private-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
