<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Held-out table</title></head>
<body>
  <h1>Prices</h1>
  <table>
    <thead><tr><th>Item</th><th>Price</th></tr></thead>
    <tbody>
      <tr><td>Widget</td><td id="price">$12.50</td></tr>
      <tr><td>Gadget</td><td>$9.00</td></tr>
    </tbody>
  </table>
</body>
</html>
