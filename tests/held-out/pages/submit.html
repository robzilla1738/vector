<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Held-out name form</title></head>
<body>
  <h1>Name</h1>
  <form id="f">
    <label>Name <input id="name" name="name" type="text"></label>
    <button type="submit">Submit</button>
  </form>
  <p id="out">not submitted</p>
  <script>
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = document.getElementById("name").value;
      document.getElementById("out").textContent = "submitted:" + v;
    });
  </script>
</body>
</html>
