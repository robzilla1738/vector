<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aux</title>
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      :root {
        color-scheme: dark;
        --first-ink: #ffffffd9;
        --first-muted: #ffffff8c;
        --first-surface: #ffffff14;
        --first-line: #ffffff26;
        --first-window: #17171780;
        --first-shadow: #0000001a;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --first-ink: #000000f2;
        --first-muted: #0000008c;
        --first-surface: #ffffff;
        --first-line: #0000001a;
        --first-window: #ffffff80;
        --first-shadow: #0000000d;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #first-frame {
        height: 100%;
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        color: var(--first-ink);
        background: var(--first-window);
        font:
          14px "Geist Variable",
          system-ui,
          sans-serif;
      }
      #first-frame * {
        box-sizing: border-box;
      }
      .first-sidebar {
        padding: 42px 8px 0;
        border-right: 0.5px solid var(--first-line);
        display: flex;
        flex-direction: column;
      }
      .first-section {
        height: 28px;
        padding: 6px 8px;
        color: var(--first-muted);
      }
      .first-row {
        height: 32px;
        padding: 7px 8px;
        border-radius: 8px;
      }
      .first-separator {
        height: 0.5px;
        background: var(--first-line);
        margin: 12px 8px;
      }
      .first-footer {
        height: 42px;
        margin-top: auto;
        padding: 12px 8px;
        border-top: 0.5px solid var(--first-line);
      }
      .first-main {
        min-width: 0;
        overflow: auto;
      }
      .first-toolbar {
        height: 42px;
        border-bottom: 0.5px solid var(--first-line);
      }
      .first-home {
        max-width: 72rem;
        margin: auto;
        padding: 10rem 2rem 5rem;
      }
      .first-mark {
        display: block;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 3rem;
      }
      .first-entry-wrap {
        max-width: 50rem;
        margin: auto;
        padding: 0 1rem;
      }
      .first-entry {
        display: flex;
        gap: 0.625rem;
        padding: 0.625rem;
        margin: 0 1rem;
        border-radius: 1.4rem;
        corner-shape: superellipse(1.4);
        background: var(--first-surface);
        box-shadow:
          0 0 0 0.5px var(--first-line),
          0 4px 6px -1px var(--first-shadow),
          0 2px 4px -2px var(--first-shadow);
        transition: box-shadow 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .first-entry:focus-within {
        box-shadow:
          0 0 0 1px var(--first-line),
          0 20px 25px -5px var(--first-shadow);
      }
      #first-frame-entry {
        min-width: 0;
        flex: 1;
        height: 2rem;
        border: 0;
        outline: none;
        padding: 0.25rem 0.5rem;
        font:
          500 16px "Geist Variable",
          system-ui,
          sans-serif;
        background: transparent;
        color: var(--first-ink);
      }
      #first-frame-entry::placeholder {
        color: var(--first-muted);
      }
      .first-modes {
        display: flex;
        height: 2rem;
        padding: 3px;
        border-radius: 0.7rem;
        background: var(--first-surface);
      }
      .first-modes input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .first-modes label {
        display: grid;
        place-items: center;
        width: 4rem;
        border-radius: 0.525rem;
        color: var(--first-muted);
      }
      .first-modes input:checked + label {
        background: var(--first-surface);
        color: var(--first-ink);
        box-shadow: 0 0 0 0.5px var(--first-line);
      }
      .first-modes input:focus-visible + label {
        outline: 2px solid #38bdf8;
      }
      @media (max-width: 640px) {
        #first-frame {
          grid-template-columns: 0 minmax(0, 1fr);
        }
        .first-sidebar {
          visibility: hidden;
          overflow: hidden;
        }
        .first-home {
          padding: 5rem 1rem;
        }
        .first-entry-wrap {
          padding: 0;
        }
        .first-entry {
          flex-wrap: wrap;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .first-entry {
          transition: none;
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        :root {
          --first-window: #171717;
        }
        :root[data-theme="light"] {
          --first-window: #ffffff;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/arch-mark.svg" />
  </head>
  <body>
    <div id="root">
      <div id="first-frame">
        <aside class="first-sidebar" aria-hidden="true">
          <div class="first-section">Bookmarks</div>
          <div class="first-separator"></div>
          <div class="first-section">Chats with Aux</div>
          <div class="first-row">New chat</div>
          <div class="first-separator"></div>
          <div class="first-section">Tabs</div>
          <div class="first-row">New tab</div>
          <div class="first-footer">Aux</div>
        </aside>
        <div class="first-main">
          <div class="first-toolbar" aria-hidden="true"></div>
          <main class="first-home" aria-label="Aux Home">
            <img class="first-mark" src="/arch-mark.svg" alt="Aux" />
            <div class="first-entry-wrap">
              <div class="first-entry">
                <input
                  id="first-frame-entry"
                  aria-label="Search or ask Aux"
                  placeholder="Search or ask Aux"
                  autocomplete="off"
                />
                <div class="first-modes" role="group" aria-label="Search or Ask">
                  <input
                    id="first-frame-search"
                    type="radio"
                    name="first-frame-mode"
                    value="search"
                    checked
                  />
                  <label for="first-frame-search">Search</label>
                  <input id="first-frame-ask" type="radio" name="first-frame-mode" value="ask" />
                  <label for="first-frame-ask">Ask</label>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
