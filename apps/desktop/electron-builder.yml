# Keep the installed bundle ID and package app.name stable for saved data.
# productName changes only the visible package; do not add it to package.json.
appId: dev.vector.browser
productName: Aux Browser
copyright: Aux

directories:
  output: ../../release
  buildResources: build

files:
  - dist/**
  - package.json
  - "!node_modules/**" # main+preload are esbuild-bundled; no runtime deps

asar: true

# the forked runtime + its production deps are staged by scripts/package-local.mjs
extraResources:
  - from: "dist/mcp"
    to: "mcp"
    filter:
      - "**/*"
  - from: "../../release/.staging/runtime"
    to: "runtime"
    filter:
      - "**/*"
      - "**/node_modules"
      - "**/node_modules/**" # bundled runtime deps — override default exclusion
  - from: "../../release/.staging/engine"
    to: "engine"
    filter:
      - "**/*"

mac:
  extendInfo:
    CFBundleDisplayName: Aux
  category: public.app-category.productivity
  icon: icon.icns
  target:
    - dir # local dev package — unsigned, fast; add dmg/zip for distribution
  identity: null

win:
  target:
    - dir

linux:
  target:
    - dir
  category: Utility
