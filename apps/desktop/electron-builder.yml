# Keep the installed bundle ID and package app.name stable for saved data.
# productName changes only the visible package; do not add it to package.json.
appId: dev.aux.browser
productName: Aux Browser
copyright: Aux

directories:
  output: ../../release
  buildResources: build

files:
  - dist/**
  - package.json
  - "!node_modules/**" # main+preload are esbuild-bundled; no runtime deps
  - "!dist/*.tsbuildinfo"
  - "!dist/.vite/**" # build manifest, used only by scripts/check-budgets.mjs
  - "!dist/.bundle-meta/**" # esbuild metafiles from bundle.mjs

# Chromium ships ~55 UI locale packs (~46 MB); the shell is English-only.
electronLanguages:
  - en
  - en_GB

asar: true
asarUnpack:
  - dist/main/liquid-glass.node
  - dist/main/aux-dictation

# the forked runtime bundle + vendored playwright-core are staged by scripts/package-local.mjs
extraResources:
  - from: "dist/mcp"
    to: "mcp"
    filter:
      - "**/*"
  - from: "../../release/.staging/runtime"
    to: "runtime"
    filter:
      - "**/*"

mac:
  extendInfo:
    NSMicrophoneUsageDescription: Aux uses your microphone only while you choose to dictate a message or allow a website to use it.
    NSSpeechRecognitionUsageDescription: Aux turns your speech into editable text using on-device recognition.
    CFBundleDisplayName: Aux
  category: public.app-category.productivity
  icon: icon.icns
  target:
    - dir # local dev package — unsigned, fast; add dmg/zip for distribution
  identity: null

win:
  target:
    - dir

linux:
  target:
    - dir
  category: Utility
